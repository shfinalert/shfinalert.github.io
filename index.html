<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="shfinalert — 조건 충족 차트 알람 리뷰">
<title>shfinalert</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect x="6" y="8" width="6" height="14" rx="1.5" fill="%23f23645"/><rect x="8.5" y="4" width="1" height="24" fill="%23f23645"/><rect x="19" y="12" width="6" height="12" rx="1.5" fill="%232962ff"/><rect x="21.5" y="8" width="1" height="20" fill="%232962ff"/></svg>'>
<style>
/* ------------------------------------------------------------------ tokens */
:root, [data-theme="light"] {
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f3f0;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --border: rgba(11,11,11,.10);
  --accent: #2a78d6; --accent-ink: #1c5cab; --accent-tint: #e3eefb;
  --up: #f23645; --down: #2962ff;
  --up-tint: #fdeaea; --down-tint: #e6edfd;
  --up-ink: #b71c1c; --down-ink: #1c4fb8;
  --shadow: 0 1px 2px rgba(11,11,11,.05), 0 4px 16px rgba(11,11,11,.05);
}
[data-theme="dark"] {
  --page: #111418; --surface: #171b21; --surface-2: #20262e;
  --ink: #d7dce2; --ink-2: #c8cfd8; --muted: #9aa4b2;
  --grid: #262c35; --border: #262c35;
  --accent: #3b82f6; --accent-ink: #7ab4ff;
  --accent-tint: color-mix(in srgb, var(--accent) 16%, transparent);
  --up: #d43a3a; --down: #2c62d4;
  --up-tint: color-mix(in srgb, var(--up) 15%, transparent);
  --down-tint: color-mix(in srgb, var(--down) 16%, transparent);
  --up-ink: #e57373; --down-ink: #7ab4ff;
  --pos: #81c784; --neg: #e57373;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--page); color: var(--ink);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo",
        "Noto Sans KR", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent-tint); }
.skip { position: absolute; left: -9999px; top: 0; background: var(--surface); padding: 8px 14px; z-index: 99; }
.skip:focus { left: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ------------------------------------------------------------------ topbar */
.topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(8px);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
.badge-sample {
  font-size: 11px; font-weight: 700; letter-spacing: .06em;
  color: var(--accent-ink); background: var(--accent-tint);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  padding: 1px 8px; border-radius: 999px;
}
.top-spacer { flex: 1; }
.updated { font-size: 12px; color: var(--muted); white-space: nowrap; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 8px; color: var(--ink-2); border: 1px solid transparent;
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--border); }
#nav-toggle { display: none; }

/* ------------------------------------------------------------------ layout */
.layout { display: grid; grid-template-columns: 292px minmax(0, 1fr); min-height: calc(100vh - 55px); }
.sidebar {
  border-right: 1px solid var(--border); background: var(--surface);
  position: sticky; top: 55px; height: calc(100vh - 55px); display: flex; flex-direction: column;
}
.side-controls { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
.search { width: 100%; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--page); }
.search::placeholder { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--border); color: var(--ink-2); background: var(--surface);
}
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.tree { flex: 1; overflow-y: auto; padding: 10px 8px 16px; }
.tree-day { margin-bottom: 2px; }
.tree-day > .day-row { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; text-align: left; font-weight: 600; }
.tree-day > .day-row:hover { background: var(--surface-2); }
.tree-day.selected > .day-row { background: var(--accent-tint); color: var(--accent-ink); }
.day-row .chev { transition: transform .15s ease; color: var(--muted); flex: none; }
.day-row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.day-row .d-label { flex: 1; }
.day-count { font-size: 11.5px; font-weight: 700; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.day-count.zero { color: var(--muted); background: transparent; border: 1px dashed var(--border); }
.tree-items { list-style: none; margin: 2px 0 6px; padding: 0 0 0 14px; }
.tree-items button {
  width: 100%; display: flex; align-items: center; gap: 8px; padding: 5px 10px;
  border-radius: 7px; text-align: left; font-size: 12.5px; color: var(--ink-2);
  border-left: 2px solid transparent;
}
.tree-items button:hover { background: var(--surface-2); }
.tree-items button.selected { border-left-color: var(--accent); background: var(--accent-tint); color: var(--accent-ink); }
.t-time { font-variant-numeric: tabular-nums; color: var(--muted); flex: none; }
.t-sym { font-weight: 700; }
.t-rule { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tf-chip { flex: none; font-size: 10.5px; font-weight: 700; border: 1px solid var(--border); color: var(--muted); padding: 0 6px; border-radius: 5px; background: var(--surface); }
.side-foot { padding: 10px 16px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--border); }
#backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 45; }

/* ------------------------------------------------------------------ main */
.main { padding: 20px clamp(14px, 3vw, 34px) 60px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; max-width: 1120px; margin: 0 0 22px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px 10px; }
.stat .s-label { font-size: 12px; color: var(--muted); }
.stat .s-value { font-size: 24px; font-weight: 650; margin-top: 1px; }
.stat .s-sub { font-size: 11.5px; color: var(--muted); }
.view-head { max-width: 1120px; margin: 0 0 14px; }
.view-head h1 { font-size: 20px; margin: 0 0 2px; }
.view-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 12.5px; }
.cards { display: flex; flex-direction: column; gap: 22px; max-width: 1120px; }

/* ------------------------------------------------------------------ card */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 76px;
}
.card.flash { animation: cardflash 1.6s ease 1; }
@keyframes cardflash { 0%, 35% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: var(--shadow); } }
.card-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 13px 18px 11px; }
.dir { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.dir.long { background: var(--up-tint); color: var(--up-ink); }
.dir.short { background: var(--down-tint); color: var(--down-ink); }
.card-sym { font-size: 16.5px; font-weight: 750; }
.card-rule { color: var(--ink-2); font-weight: 600; }
.card-time { color: var(--muted); font-size: 12.5px; }
.badge-new { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; color: var(--accent-ink); background: var(--accent-tint); padding: 1px 7px; border-radius: 999px; }
.head-spacer { flex: 1; }
.prob-pill {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700;
  padding: 3px 12px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.prob-pill .lift.up { color: var(--up-ink); }
.prob-pill .lift.down { color: var(--down-ink); }
.tabs { display: flex; gap: 4px; padding: 0 18px 10px; flex-wrap: wrap; align-items: center; }
.tab { padding: 4px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 650; color: var(--ink-2); border: 1px solid transparent; }
.tab:hover:not(:disabled) { background: var(--surface-2); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--page); }
.tab:disabled { color: var(--grid); cursor: not-allowed; }
.tab-spacer { flex: 1; }
.expand-btn { font-size: 12px; color: var(--muted); padding: 3px 10px; border-radius: 8px; border: 1px solid var(--border); }
.expand-btn:hover { background: var(--surface-2); }

/* 차트: 공용 TypeScript renderer (동일 지표·배경) */
.chart-box { position: relative; height: 380px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: #a5d6a7; }
.chart-box.expanded { height: 72vh; }
.chart-box canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: pan-y; }
.chart-box canvas.csc-chart-base, .chart-box canvas.csc-chart-overlay { pointer-events: none; }
.chart-box canvas.csc-chart-pointer { pointer-events: auto; }
.chart-box .csc-chart-touch-gutter { position: absolute; inset: 0 0 0 auto; width: 64px; pointer-events: none; touch-action: none; }
@media (hover: none) and (pointer: coarse) {
  .chart-box .csc-chart-touch-gutter { pointer-events: auto; }
}
.chart-box .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #33691e; font-size: 13px; pointer-events: none; }
.chart-hint { position: absolute; right: 8px; top: 6px; font-size: 10.5px; color: rgba(0,0,0,.45); pointer-events: none; }

.evidence { padding: 14px 18px 16px; }
.ev-cap { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
.table-wrap { overflow-x: auto; }
table.ev { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13px; }
.ev th { text-align: left; font-size: 11.5px; font-weight: 650; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
.ev th.r, .ev td.r { text-align: right; }
.ev td { padding: 7px 10px; border-bottom: 1px solid color-mix(in srgb, var(--grid) 55%, transparent); vertical-align: middle; }
.ev tr:last-child td { border-bottom: 0; }
.ev .ok { color: var(--up-ink); font-weight: 700; margin-right: 6px; }
.lift-badge { display: inline-block; min-width: 52px; text-align: center; font-size: 12px; font-weight: 750; padding: 1.5px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; background: var(--surface-2); color: var(--ink-2); }
.lift-badge.up { background: var(--up-tint); color: var(--up-ink); }
.lift-badge.down { background: var(--down-tint); color: var(--down-ink); }
.note { margin: 12px 2px 0; font-size: 12.5px; color: var(--ink-2); display: flex; gap: 7px; }
.note::before { content: "메모"; flex: none; font-weight: 700; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; height: fit-content; margin-top: 1px; }

.empty { max-width: 1120px; border: 1px dashed var(--grid); border-radius: 14px; padding: 54px 20px; text-align: center; background: var(--surface); }
.empty .e-msg { font-size: 15px; font-weight: 650; color: var(--ink-2); }
.empty .e-sub { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.empty button { margin-top: 14px; padding: 6px 16px; border-radius: 8px; font-weight: 650; background: var(--accent-tint); color: var(--accent-ink); }
.main-foot { max-width: 1120px; margin-top: 34px; font-size: 11.5px; color: var(--muted); line-height: 1.9; border-top: 1px solid var(--border); padding-top: 12px; }
kbd { font: 600 10.5px/1 ui-monospace, monospace; color: var(--ink-2); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 1.5px 5px; background: var(--surface); }

/* 다크 셸의 방향색(빨강/파랑)과 상태색(긍정/부정)을 Viewer 의미 토큰대로 분리 */
[data-theme="dark"] .prob-pill .lift.up,
[data-theme="dark"] .ev .ok { color: var(--pos); }
[data-theme="dark"] .prob-pill .lift.down { color: var(--neg); }
[data-theme="dark"] .lift-badge.up {
  background: color-mix(in srgb, var(--pos) 15%, transparent); color: var(--pos);
}
[data-theme="dark"] .lift-badge.down {
  background: color-mix(in srgb, var(--neg) 15%, transparent); color: var(--neg);
}

@media (max-width: 920px) {
  .layout { grid-template-columns: 1fr; }
  #nav-toggle { display: inline-flex; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; height: 100vh; width: min(84vw, 320px); z-index: 50; transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow); }
  .sidebar.open { transform: translateX(0); }
  .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .updated { display: none; }
  .chart-box { height: 300px; }
}
</style>
</head>
<body>
<a class="skip" href="#app">본문 바로가기</a>

<header class="topbar">
  <button id="nav-toggle" class="icon-btn" aria-label="알람 목록 열기" aria-expanded="false">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="8" width="6" height="14" rx="1.5" fill="#f23645"/><rect x="8.5" y="4" width="1" height="24" fill="#f23645"/><rect x="19" y="12" width="6" height="12" rx="1.5" fill="#2962ff"/><rect x="21.5" y="8" width="1" height="20" fill="#2962ff"/></svg>
    shfinalert
    <span id="sample-badge" class="badge-sample" hidden>SAMPLE</span>
  </div>
  <span class="top-spacer"></span>
  <span id="updated" class="updated"></span>
  <button id="theme-toggle" class="icon-btn" aria-label="테마 전환">
    <svg id="ic-moon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M13.4 9.9A5.9 5.9 0 0 1 6.1 2.6 6 6 0 1 0 13.4 9.9z"/></svg>
    <svg id="ic-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" hidden><circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.8M8 13.2V15M1 8h1.8M13.2 8H15M2.9 2.9l1.3 1.3M11.8 11.8l1.3 1.3M13.1 2.9l-1.3 1.3M4.2 11.8l-1.3 1.3"/></svg>
  </button>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar" aria-label="알람 목록">
    <div class="side-controls">
      <input id="search" class="search" type="search" placeholder="심볼 · 조건 검색" aria-label="심볼, 조건 검색">
      <div class="chips" role="group" aria-label="알람 타임프레임 필터" id="tf-chips"></div>
    </div>
    <nav id="date-tree" class="tree" aria-label="날짜별 알람"></nav>
    <footer class="side-foot">30일 경과 항목은 자동 삭제됩니다</footer>
  </aside>
  <div id="backdrop" hidden></div>

  <main id="app" class="main" tabindex="-1">
    <div class="stats" id="stats" hidden></div>
    <div id="view"></div>
    <footer class="main-foot" id="main-foot" hidden></footer>
  </main>
</div>

<script src="assets/pages-chart.js"></script>
</body>
</html>
